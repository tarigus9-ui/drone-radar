name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DroneRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDemoDebugUnitTest --no-daemon

      # Release signing: the key lives ONLY in GitHub secrets (never in the repository).
      # Secrets go to this one step's env (not GITHUB_ENV), so no other step or action sees them.
      - name: Build signed release APKs (main only)
        if: github.ref == 'refs/heads/main'
        env:
          DR_KEYSTORE_B64: ${{ secrets.DR_KEYSTORE_B64 }}
          DR_KEYSTORE_PASSWORD: ${{ secrets.DR_STORE_PASSWORD }}
          DR_KEY_PASSWORD: ${{ secrets.DR_STORE_PASSWORD }}
          DR_KEY_ALIAS: droneradar
        run: |
          if [ -z "$DR_KEYSTORE_B64" ] || [ -z "$DR_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets missing — building TEST versions only."
            gradle :app:assembleDemoDebug :app:assembleClientDebug --no-daemon
            exit 0
          fi
          export DR_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$DR_KEYSTORE"' EXIT
          printf '%s' "$DR_KEYSTORE_B64" | base64 -d > "$DR_KEYSTORE"
          unset DR_KEYSTORE_B64
          gradle :app:assembleDemoRelease :app:assembleClientRelease --no-daemon

      - name: Build test APKs (other branches)
        if: github.ref != 'refs/heads/main'
        run: gradle :app:assembleDemoDebug :app:assembleClientDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: DroneRadar-apk
          path: DroneRadar/out/*.apk
